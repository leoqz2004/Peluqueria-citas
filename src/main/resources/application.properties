spring.application.name=peluqueria-citas
# Perfil por defecto: "demo" (base H2 en memoria con datos de ejemplo, no requiere MySQL).
# Para MySQL: SPRING_PROFILES_ACTIVE=mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:demo}
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.web.locale=es_PE
spring.web.locale-resolver=fixed
spring.thymeleaf.cache=false
# --- Seguridad (OWASP A02/A07) ---
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# En produccion con HTTPS: COOKIE_SECURE=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
# Errores: nunca exponer trazas, mensajes internos ni errores de binding
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.servlet.multipart.enabled=false
server.tomcat.max-http-form-post-size=64KB
# Control de intentos de login
app.seguridad.max-intentos=5
app.seguridad.bloqueo-minutos=15
# Parametros de negocio
app.horarios.paso-minutos=30
app.recordatorio.horas=24,2
