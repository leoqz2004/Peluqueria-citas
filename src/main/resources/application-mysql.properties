# Ejecutar antes database/schema.sql en MySQL 8.
spring.datasource.url=jdbc:mysql://localhost:3306/peluqueria_citas?useSSL=true&allowPublicKeyRetrieval=false&serverTimezone=America/Lima
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# Produccion: definir COOKIE_SECURE=true (HTTPS) y credenciales SOLO por variables de entorno
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
