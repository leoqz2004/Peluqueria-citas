# Aplicacion + monitoreo (Prometheus + Grafana). Ejecutar desde la carpeta deploy/:
#   docker compose --env-file ../.env up -d --build
# Sin .env arranca en perfil demo (H2). Para MySQL/SQL Server definir SPRING_PROFILES_ACTIVE, DB_URL, DB_USER, DB_PASSWORD.
# Grafana: http://localhost:3000 (admin / GRAFANA_PASSWORD)   Prometheus: http://localhost:9090
services:
  app:
    build: ..
    container_name: bella-estilo
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      DB_URL: ${DB_URL:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Prometheus entra por esta red de confianza (ver app.monitoreo.ips-permitidas)
      MONITOREO_IPS: 127.0.0.1/32,::1/128,172.28.0.0/16
    volumes:
      - app-logs:/app/logs
    networks: [bella]

  prometheus:
    image: prom/prometheus:latest
    container_name: bella-prometheus
    restart: unless-stopped
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ../monitoreo/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoreo/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus-data:/prometheus
    depends_on: [app]
    networks: [bella]

  grafana:
    image: grafana/grafana:latest
    container_name: bella-grafana
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-cambiar_esta_clave}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoreo/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoreo/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [bella]

volumes:
  app-logs:
  prometheus-data:
  grafana-data:

networks:
  bella:
    ipam:
      config:
        - subnet: 172.28.0.0/16
