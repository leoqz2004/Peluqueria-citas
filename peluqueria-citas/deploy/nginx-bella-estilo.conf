# Proxy inverso con HTTPS delante de Spring Boot (puerto 8080 solo en localhost).
# IMPORTANTE: con el proxy, la app ve las peticiones como 127.0.0.1, que es una red de confianza para
# /actuator/prometheus. Por eso aqui se BLOQUEA /actuator/ desde Internet y solo se publica /actuator/health.
server {
    listen 80;
    server_name bellaestilo.example.pe;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bellaestilo.example.pe;
    ssl_certificate     /etc/letsencrypt/live/bellaestilo.example.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bellaestilo.example.pe/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /actuator/health { proxy_pass http://127.0.0.1:8080; }
    location /actuator/         { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 64k;
    }
}
