[pytest]
# Pruebas Python (caja negra) sobre la aplicacion Spring Boot en ejecucion.
# Las pruebas JUnit de Maven (src/test/java) NO se tocan y siguen funcionando con `mvn test`.
testpaths = tests_python
python_files = test_*.py
addopts = -ra
markers =
    funcional: pruebas funcionales (API y paginas) de caja negra
    seguridad: pruebas de seguridad (OWASP Top 10)
    e2e: pruebas de extremo a extremo con navegador (Playwright)
    observacion: hallazgo conocido y documentado (xfail); no rompe la ejecucion
filterwarnings =
    ignore::DeprecationWarning
