# Prometheus: consulta las metricas de Bella Estilo cada 15 s.
# Con docker compose el destino es el contenedor "app". Si la app corre en el host (mvn spring-boot:run),
# cambiar el target por host.docker.internal:8080 y arrancar la app con MONITOREO_IPS=127.0.0.1/32,::1/128,172.28.0.0/16
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: bella-estilo
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]
