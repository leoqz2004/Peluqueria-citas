spring.application.name=peluqueria-citas
# Perfil por defecto: "demo" (base H2 en memoria con datos de ejemplo, no requiere MySQL).
# Para MySQL: SPRING_PROFILES_ACTIVE=mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:demo}
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.web.locale=es_PE
spring.web.locale-resolver=fixed
# Cache de plantillas activa (rendimiento). El perfil demo la desactiva para editar en caliente.
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
# --- Seguridad (OWASP A02/A07) ---
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# En produccion con HTTPS: COOKIE_SECURE=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
# Errores: nunca exponer trazas, mensajes internos ni errores de binding
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.servlet.multipart.enabled=false
server.tomcat.max-http-form-post-size=64KB
# Control de intentos de login
app.seguridad.max-intentos=5
app.seguridad.bloqueo-minutos=15
# Parametros de negocio
app.horarios.paso-minutos=30
app.recordatorio.horas=24,2

# --- Rendimiento ---
# Carga por lotes de relaciones LAZY: evita consultas N+1 sin cambiar el mapeo.
spring.jpa.properties.hibernate.default_batch_fetch_size=16
spring.datasource.hikari.pool-name=BellaEstiloPool
# Apagado ordenado: termina las peticiones en curso antes de cerrar.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Monitoreo (Semana 17) ---
# Logs: archivo JSON estructurado (logstash) con rotacion; la consola mantiene formato legible.
logging.file.name=${LOG_DIR:logs}/peluqueria.log
logging.structured.format.file=logstash
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=500MB
logging.level.root=INFO
logging.level.pe.utp.peluqueria=${LOG_LEVEL:INFO}
logging.level.SEGURIDAD=INFO
logging.level.MANTENIMIENTO=INFO
# Actuator: solo lo necesario. env, beans, heapdump, etc. NO se exponen.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s
management.info.env.enabled=true
info.app.nombre=Bella Estilo
info.app.version=@project.version@
# /actuator/prometheus y /actuator/metrics: solo desde estas redes (CIDR) o con rol ADMINISTRADOR.
app.monitoreo.ips-permitidas=${MONITOREO_IPS:127.0.0.1/32,::1/128}

# --- Mantenimiento (Semana 18) ---
# Limpieza nocturna de notificaciones ya enviadas/fallidas (hora de Lima).
app.mantenimiento.habilitado=true
app.mantenimiento.cron=0 30 3 * * *
app.mantenimiento.retencion-notificaciones-dias=90
