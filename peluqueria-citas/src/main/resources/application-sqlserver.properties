# Activar con SPRING_PROFILES_ACTIVE=sqlserver.
# Para SQL Server Express o una instancia con puerto distinto, definir DB_URL completo.
# Ejemplo local con puerto TCP 1433 y certificado autofirmado de desarrollo.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=peluqueria_citas;encrypt=true;trustServerCertificate=true;sendTimeAsDatetime=false}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# En SQL Server las columnas hora_inicio/hora_fin son TIME, no DATETIME.
# Aplicar incluso cuando DB_URL es proporcionada por una variable de entorno.
spring.datasource.hikari.data-source-properties.sendTimeAsDatetime=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# Solo desarrollo por http://localhost. Usar COOKIE_SECURE=true bajo HTTPS.
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
